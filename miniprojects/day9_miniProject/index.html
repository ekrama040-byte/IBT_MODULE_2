<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addis Market Shopping List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>🛒 Addis Market Shopping List</h1>
        
        <!-- Form to add items -->
        <form id="addform">
            <input type="text" id="name" placeholder="Item Name (e.g., Shiro)" required>
            <input type="number" id="price" placeholder="Price in ETB" min="1" required>
            <button type="submit">Add Item</button>
        </form>

        <!-- Shopping List Container -->
        <ul id="list"></ul>

        <!-- Total Price Display -->
        <div class="total-container">
            <h3>Total: <span id="total">0</span> ETB</h3>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
