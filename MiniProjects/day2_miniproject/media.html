<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Ethiopia - Media</title>
</head>
<body>
    <main>
        <h2>Ethiopian Heritage & Landscapes</h2>
        
        <!-- Image with figure and figcaption semantic wrappers -->
        <figure>
            <img src="https://unsplash.com" alt="A panoramic high-angle view of the medieval rock-hewn Church of Saint George in Lalibela, shaped like a cross" width="600">
            <figcaption>The spectacular Rock-Hewn Church of Biete Ghiorgis (St. George) in Lalibela, Ethiopia.</figcaption>
        </figure>

        <h3>Our Location Map</h3>
        <!-- Map iframe with a descriptive title attribute for screen readers -->
        <iframe 
            src="https://google.com" 
            width="600" 
            height="450" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade"
            title="Interactive Google Map showing the Bole sub-city district in Addis Ababa, Ethiopia">
        </iframe>
    </main>
</body>
</html>
