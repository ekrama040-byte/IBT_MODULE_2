<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETB Currency Dashboard</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --primary: #059669;
            --primary-hover: #047857;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

        h1, h2 { margin-top: 0; font-weight: 700; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.15rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }

        #status-area {
            font-size: 0.875rem;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1.25rem;
            display: none;
        }
        .status-loading { background: #eff6ff; color: #1d4ed8; }
        .status-error { background: var(--danger-bg); color: var(--danger); }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--muted);
        }

        input, select {
            width: 100%;
            padding: 0.625rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.25rem;
        }

        button {
            padding: 0.625rem 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .btn-primary { background: var(--primary); color: white; flex: 2; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--border); color: var(--text); flex: 1; }

        #result-area {
            margin-top: 1.25rem;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary);
            min-height: 1.5rem;
        }

        .watchlist-section {
            margin-top: 2rem;
        }

        .watchlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px dashed var(--border);
        }

        .btn-delete {
            background: none;
            color: var(--danger);
            padding: 0.25rem 0.5rem;
            font-weight: 500;
        }
        .btn-delete:hover { background: var(--danger-bg); border-radius: 4px; }
        
        .empty-text { color: var(--muted); font-style: italic; font-size: 0.875rem; }
    </style>
</head>
<body>

    <div class="container">
        <h1>ETB Currency Exchange</h1>
        
        <!-- 1. Status Area -->
        <div id="status-area"></div>

        <!-- 1. Convert Form -->
        <form id="convert-form">
            <div class="form-group">
                <label for="amount">Amount (ETB)</label>
                <input type="number" id="amount" step="any" placeholder="Enter amount in Birr">
            </div>
            <div class="form-group">
                <label for="currency-select">Convert To</label>
                <!-- 1. Empty Currency Select -->
                <select id="currency-select"></select>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn-primary">Convert</button>
                <button type="button" id="add-watchlist-btn" class="btn-secondary">+ Watchlist</button>
            </div>
        </form>

        <!-- 1. Result Area -->
        <div id="result-area"></div>

        <!-- 1. Empty Watchlist Container -->
        <div class="watchlist-section">
            <h2>My Watchlist</h2>
            <div id="watchlist"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
