<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 14 Task 1: Flexbox Navigation Bar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
        }

        /* Flexbox Header Structural Engine */
        .site-header {
            background-color: #ffffff;
            border-bottom: 1px solid #e9ecef;
            padding: 16px 24px;
            
            /* Core Flex Setup */
            display: flex;
            justify-content: space-between; /* Logo left, interactive group right */
            align-items: center;            /* Vertical centering alignment */
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #006633; /* Ethiopian Green */
            text-decoration: none;
        }

        /* Right Group Container inherits Flex layout styles */
        .nav-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: #495057;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #006633;
        }

        .action-btn {
            background-color: #ffcc00; /* Ethiopian Gold */
            color: #111111;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header class="site-header">
        <!-- Logo on the left -->
        <a href="#" class="logo">Habesha Market</a>

        <!-- Links and Button grouped on the right -->
        <div class="nav-group">
            <nav aria-label="Main Navigation">
                <ul class="nav-links">
                    <li><a href="#">Shop</a></li>
                    <li><a href="#">Our Story</a></li>
                    <li><a href="#">Contact</a></li>
                </ul>
            </nav>
            <a href="#" class="action-btn">TeleBirr Pay</a>
        </div>
    </header>

</body>
</html>
